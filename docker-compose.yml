services:
  bot:
    build: .
    image: maggybot:latest
    container_name: maggybot
    restart: unless-stopped
    init: true
    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN:-}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID:-}
      PREFIX: ${PREFIX:-maggy}
      WEATHERAPI: ${WEATHERAPI:-}
      VOICE_DEBUG: ${VOICE_DEBUG:-}
      YTDLP_PLAYER_CLIENTS: ${YTDLP_PLAYER_CLIENTS:-}
      YTDLP_COOKIES: ${YTDLP_COOKIES:-}
      YTDLP_EXTRA_ARGS: ${YTDLP_EXTRA_ARGS:-}
    volumes:
      - bot-data:/app/data
      # Para destrabar el bloqueo de YouTube en un server: exportá las cookies
      # y descomentá esto junto con YTDLP_COOKIES=/app/cookies.txt en el .env
      # - ./cookies.txt:/app/cookies.txt:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # One-off: registra los slash commands. No arranca con "up".
  #   docker compose run --rm deploy
  deploy:
    build: .
    image: maggybot:latest
    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN:-}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID:-}
    command: ["node", "deploy-commands.js"]
    profiles: ["tools"]
    restart: "no"

volumes:
  bot-data:
